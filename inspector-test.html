<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CDP Inspector Test Target</title>
</head>
<body>
  <h1>CDP Inspector Test Target</h1>
  <p>Open the console to see output.</p>

  <script>
    // Simple test script for the CDP inspector to step through
    function fibonacci(n) {
      if (n <= 1) return n;
      const a = fibonacci(n - 1);
      const b = fibonacci(n - 2);
      return a + b;
    }

    function processData(data) {
      const result = [];
      for (let i = 0; i < data.length; i++) {
        const value = data[i] * 2;
        result.push(value);
      }
      return result;
    }

    function main() {
      console.log('Starting test script...');

      const numbers = [1, 2, 3, 4, 5];
      console.log('Input:', numbers);

      const processed = processData(numbers);
      console.log('Processed:', processed);

      for (let i = 0; i < 5; i++) {
        const fib = fibonacci(i);
        console.log(`fib(${i}) = ${fib}`);
      }

      console.log('Test script complete.');
    }

    // Run after a short delay to give inspector time to attach
    setTimeout(main, 1000);
  </script>
</body>
</html>
