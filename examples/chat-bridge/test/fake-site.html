<!doctype html>
<meta charset="utf-8">
<title>fake chat</title>
<style>
  body { font: 15px sans-serif; margin: 2em; }
  .user { color: #555; margin: .5em 0; white-space: pre-wrap; }
  .reply, .answer { margin: .5em 0; white-space: pre-wrap; }
  .notice { color: #a00; margin: .5em 0; }
  textarea { width: 40em; height: 4em; }
</style>
<div id="log"></div>
<textarea id="prompt" autofocus></textarea>
<script>
/* A stand-in for a consumer chat site, for examples/chat-bridge/test/run.sh.
   The prompt picks the behaviour with a marker:
     [[pong]]   answer "pong"
     [[stream]] a longer answer, revealed in small steps
     [[tool]]   a tool_call block, arguments nested (the asked-for shape)
     [[flat]]   a tool call with flat arguments and copy-button text before it
     [[limit]]  no answer, a daily-limit notice instead
     [[limit@PORT]] the same, only on the page served on that port
     [[ignore]] never takes the prompt (the box is not emptied)
     otherwise  "echo: " and the last line of the prompt
   Opened as 127.0.0.1 (not localhost) the reply elements use another class
   name, which stands in for a site that changed its layout. */
const log = document.getElementById('log');
const box = document.getElementById('prompt');
const cls = location.hostname == '127.0.0.1' ? 'answer' : 'reply';

function text(t) {
  if(t.includes('[[pong]]')) return 'pong';
  if(t.includes('[[stream]]')) return 'echo: streaming works, chunk by chunk, until the text is complete';
  if(t.includes('[[tool]]')) return '```tool_call\n{"name":"get_weather","arguments":{"city":"Berlin"}}\n```';
  if(t.includes('[[flat]]')) return 'tool_call\nKopieren\nHerunterladen\n{"name": "get_weather", "city": "Berlin"}';
  return 'echo: ' + t.trim().split('\n').pop().slice(0, 100);
}

function add(className, content) {
  const d = document.createElement('div');
  d.className = className;
  d.textContent = content;
  log.appendChild(d);
  return d;
}

box.addEventListener('keydown', e => {
  if(e.key != 'Enter' || e.shiftKey) return;
  e.preventDefault();
  const t = box.value;
  if(!t.trim() || t.includes('[[ignore]]')) return;
  box.value = '';
  add('user', t);
  if(t.includes('[[limit]]') || t.includes(`[[limit@${location.port}]]`)) return add('notice', 'You have reached your daily message limit. Please try again in 3 hours.');

  const full = text(t), d = add(cls, '');
  let n = 0;
  const timer = setInterval(() => {
    d.textContent = full.slice(0, (n += 6));
    if(n >= full.length) clearInterval(timer);
  }, 80);
});
</script>
